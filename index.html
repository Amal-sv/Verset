<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>آيات وعلوم | Versets et Sciences</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header>
        <div class="logo">🌸 آيات وعلوم | Versets et Sciences</div>
        <span id="progress">1 / 3</span>
      </header>

      <main>
        <section id="language" class="page active">
          <div class="intro">
            <div class="flower">🌸</div>
            <h1>آيات وعلوم</h1>
            <h2>Versets et Sciences</h2>
            <p>اختر لغتك المفضلة</p>
            <p>Choisissez votre langue</p>
          </div>

          <div class="grid">
            <button class="choice" type="button" data-language="ar">
              <span>🌙</span>
              <h2>العربية</h2>
              <p>متابعة بالعربية ←</p>
            </button>

            <button class="choice" type="button" data-language="fr">
              <span>🌍</span>
              <h2>Français</h2>
              <p>Continuer en français →</p>
            </button>
          </div>
        </section>

        <section id="fields" class="page">
          <button class="back" type="button" id="backLanguage">← Retour</button>

          <h1 id="fieldTitle"></h1>
          <p id="fieldDescription"></p>

          <div id="fieldGrid" class="grid"></div>
        </section>

        <section id="details" class="page">
          <button class="back" type="button" id="backFields">← Retour</button>

          <h1 id="domainTitle"></h1>
          <p id="domainDescription"></p>

          <input type="search" id="search" placeholder="Rechercher..." />

          <div id="versesContainer"></div>

          <div class="method" id="method"></div>
        </section>
      </main>

      <footer>
        🌿 آيات وعلوم | Versets et Sciences
        <p>Science • Foi • Connaissance</p>
      </footer>
    </div>

    <script src="script.js"></script>
  </body>
</html>
